services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pathway
      POSTGRES_USER: pathway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell first}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pathway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathway -d pathway"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pathway_pgdata:
