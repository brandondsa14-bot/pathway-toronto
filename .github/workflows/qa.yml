name: PATHway Toronto quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
      - run: PYTHONPATH=backend python tools/verify-data-readiness.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require reproducible package lock
        run: test -f frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint && npm run build
      - run: cd frontend && npm audit --omit=dev --audit-level=high
